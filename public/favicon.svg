<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="catBgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="catalystGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="28" y1="18" x2="48" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Slate Glassmorphic Tile -->
  <rect width="64" height="64" rx="16" fill="url(#catBgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.5" />

  <!-- CATalyze Glyph: Dynamic Faceted "C" + Ascending Catalyst Apex Core -->
  <g filter="url(#logoGlow)">
    <!-- Outer Dynamic "C" Catalyst Arc -->
    <path 
      d="M45 20.5C40.5 16 34.5 14 28 15C19.5 16.5 13.5 24 14 32.5C14.5 41.5 22 49 31 49C38 49 43.5 45.5 47 40" 
      stroke="url(#catalystGrad)" 
      stroke-width="5" 
      stroke-linecap="round" 
    />
    <!-- Ascending Apex Bolt / Catalyst Energy Surge -->
    <path 
      d="M31 16L48 24L38 27L46 36L34 29L39 25L31 16Z" 
      fill="url(#sparkGrad)" 
    />
    <!-- Center Catalyst Spark Core -->
    <circle cx="28" cy="32" r="3" fill="#ffffff" />
    <circle cx="28" cy="32" r="6" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>